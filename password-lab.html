<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password Strength Lab</title>
<style>
:root{--bg:#070816;--panel:#10132e;--ink:#e6f4ff;--mute:#8a93b8;--a:#5ee7ff;--line:rgba(140,160,255,.2);--bad:#ff5c8a;--mid:#ffc65c;--ok:#5ee7a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f2f5ff;--panel:#e4e9ff;--ink:#0d1030;--mute:#4b5380;--a:#0089b3;--line:rgba(60,70,160,.25);--bad:#d4245a;--mid:#b57a00;--ok:#0b9a5a;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px;max-width:620px;margin:auto}
h1{font-size:1.6rem}p.s{color:var(--mute);margin:4px 0 18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.in{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.go{background:var(--a);color:#06101e;border-color:var(--a);font-weight:600}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.meter{height:10px;border-radius:9px;background:var(--line);margin:14px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.top{display:flex;justify-content:space-between;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid div{border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--mute);font-size:13px}.grid b{display:block;color:var(--ink);font-size:1.1rem}
ul{list-style:none;padding:0;display:grid;gap:6px;font-size:14px}
li::before{content:"✗ ";color:var(--bad)}li.y::before{content:"✓ ";color:var(--ok)}
#gen{margin-top:10px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;color:var(--a)}
</style>
</head>
<body>
<h1>Password Strength Lab</h1>
<p class="s">See how long a computer would take to crack your password. Everything runs in your browser, and nothing is sent anywhere.</p>
<div class="box">
<div class="in"><input id="pw" type="password" placeholder="Type a password to test" autocomplete="off" aria-label="Password"><button id="eye" aria-label="Show or hide password">Show</button></div>
<div class="meter"><i id="bar"></i></div>
<div class="top"><span id="lvl">Start typing</span><span id="ent"></span></div>
<div class="grid"><div>Estimated crack time<b id="ct">–</b></div><div>Length<b id="ln">0</b></div></div>
</div>
<div class="box"><ul id="chk"></ul></div>
<div class="box"><button id="g" class="go">Generate a strong password</button><div id="gen"></div></div>
<script>
const $=id=>document.getElementById(id);
const COMMON=["password","123456","12345678","qwerty","abc123","letmein","admin","welcome","iloveyou","111111","monkey","dragon","passw0rd","football","india123"];
function entropy(p){let c=0;if(/[a-z]/.test(p))c+=26;if(/[A-Z]/.test(p))c+=26;if(/\d/.test(p))c+=10;if(/[^a-zA-Z0-9]/.test(p))c+=32;return c?p.length*Math.log2(c):0}
function human(s){if(s<1)return"instantly";const u=[["year",31557600],["day",86400],["hour",3600],["minute",60],["second",1]];
if(s>31557600*1e9)return"billions of years+";for(const[n,v]of u)if(s>=v){const x=Math.floor(s/v);return x.toLocaleString()+" "+n+(x>1?"s":"")}}
function check(){const p=$("pw").value,low=p.toLowerCase();
const rules=[["At least 12 characters",p.length>=12],["Upper and lower case letters",/[a-z]/.test(p)&&/[A-Z]/.test(p)],["Contains a number",/\d/.test(p)],["Contains a symbol",/[^a-zA-Z0-9]/.test(p)],["Not a common password",p&&!COMMON.some(c=>low.includes(c))],["No long repeats like aaa",p&&!/(.)\1{2,}/.test(p)]];
$("chk").innerHTML=rules.map(r=>`<li class="${r[1]?"y":""}">${r[0]}</li>`).join("");
let e=entropy(p);if(!rules[4][1]||!rules[5][1])e*=.5;
const t=Math.pow(2,e)/2/1e10,i=!p?0:e<28?0:e<40?1:e<60?2:e<80?3:4;
const L=[["Very weak","#ff5c8a"],["Weak","#ff5c8a"],["Fair","#ffc65c"],["Strong","#5ee7a0"],["Excellent","#5ee7a0"]][i];
$("bar").style.width=p?(i+1)*20+"%":"0";$("bar").style.background=L[1];
$("lvl").textContent=p?L[0]:"Start typing";$("ent").textContent=p?Math.round(e)+" bits":"";
$("ct").textContent=p?human(t):"–";$("ln").textContent=p.length}
function gen(){const cs="abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?",a=new Uint32Array(16);crypto.getRandomValues(a);return[...a].map(x=>cs[x%cs.length]).join("")}
$("pw").oninput=check;
$("eye").onclick=()=>{const s=$("pw").type==="password";$("pw").type=s?"text":"password";$("eye").textContent=s?"Hide":"Show"};
$("g").onclick=()=>{const g=gen();$("gen").textContent=g;$("pw").value=g;check()};
check();
</script>
</body>
</html>
